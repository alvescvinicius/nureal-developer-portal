<div class="ambientes">
  @if (loading) {
    <mat-spinner diameter="32"></mat-spinner>
  }

  @if (loadError) {
    <p class="error-text">Não foi possível carregar os ambientes desta API.</p>
  }

  @if (detail) {
    <header class="page-header">
      <h1>{{ detail.meta.name }} — Ambientes</h1>
      <p>
        Ambiente global selecionado atualmente:
        <mat-chip disableRipple color="primary" selected>
          {{ environmentService.currentEnvironment() }}
        </mat-chip>
      </p>
    </header>

    <table mat-table [dataSource]="environmentRows" class="mat-elevation-z1">
      <ng-container matColumnDef="environment">
        <th mat-header-cell *matHeaderCellDef>Ambiente</th>
        <td mat-cell *matCellDef="let row">
          <span
            class="env-tag"
            [class.env-current]="row.environment === environmentService.currentEnvironment()"
          >
            {{ row.environment }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="url">
        <th mat-header-cell *matHeaderCellDef>URL Base</th>
        <td mat-cell *matCellDef="let row">
          <code>{{ row.url }}</code>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  }
</div>
