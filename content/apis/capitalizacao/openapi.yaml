openapi: 3.0.3
info:
  title: Nureal Capitalização API
  description: API para contratação, consulta e resgate de títulos de capitalização.
  version: "1.0.0"
  contact:
    name: Squad Capitalização
    email: squad-capitalizacao@nureal.com.br
servers:
  - url: /capitalizacao
tags:
  - name: Titulos
    description: Operações sobre títulos de capitalização
paths:
  /v1/titulos:
    get:
      operationId: listarTitulos
      tags: [Titulos]
      summary: Lista títulos de capitalização
      security:
        - BearerAuth: []
      parameters:
        - name: cpfCnpj
          in: query
          description: Filtra títulos pelo CPF/CNPJ do titular
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Lista de títulos retornada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    example: 15
                  page:
                    type: integer
                    example: 1
                  pageSize:
                    type: integer
                    example: 20
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Titulo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: contratarTitulo
      tags: [Titulos]
      summary: Contrata um novo título de capitalização
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NovoTituloRequest'
      responses:
        '201':
          description: Título contratado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Titulo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/titulos/{tituloId}:
    get:
      operationId: obterTitulo
      tags: [Titulos]
      summary: Consulta um título pelo identificador
      security:
        - BearerAuth: []
      parameters:
        - name: tituloId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Título encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Titulo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/titulos/{tituloId}/resgate:
    post:
      operationId: resgatarTitulo
      tags: [Titulos]
      summary: Solicita o resgate de um título de capitalização
      security:
        - BearerAuth: []
      parameters:
        - name: tituloId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contaBancaria]
              properties:
                contaBancaria:
                  type: string
                  example: "0001/123456-7"
      responses:
        '200':
          description: Resgate solicitado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Titulo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    TituloStatus:
      type: string
      enum: [VIGENTE, RESGATADO, CANCELADO]
    Titulo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        numero:
          type: string
          example: "CAP-2026-000045"
        titular:
          type: string
          example: "Maria Souza"
        cpfCnpj:
          type: string
          example: "123.456.789-00"
        valorContribuicao:
          type: number
          format: double
          example: 100.00
        status:
          $ref: '#/components/schemas/TituloStatus'
        dataContratacao:
          type: string
          format: date-time
    NovoTituloRequest:
      type: object
      required: [titular, cpfCnpj, valorContribuicao]
      properties:
        titular:
          type: string
          example: "Maria Souza"
        cpfCnpj:
          type: string
          example: "123.456.789-00"
        valorContribuicao:
          type: number
          format: double
          example: 100.00
    ErroPadrao:
      type: object
      properties:
        codigo:
          type: string
          example: "CAPITALIZACAO_400"
        mensagem:
          type: string
          example: "Campo 'cpfCnpj' inválido"
        timestamp:
          type: string
          format: date-time
  responses:
    BadRequest:
      description: Requisição inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErroPadrao'
    Unauthorized:
      description: Token ausente ou inválido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErroPadrao'
    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErroPadrao'
    InternalError:
      description: Erro interno inesperado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErroPadrao'
